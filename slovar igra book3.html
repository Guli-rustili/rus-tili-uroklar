<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Проверка словаря — Guli Rus tili</title>
<style>
  :root {
    --purple: #7c3aed; --purple-dark: #5b21b6; --purple-light: #f3ecfd;
    --bg: #faf8ff; --text: #201533; --gray: #6b6478; --green: #15803d; --red: #b91c1c;
    --border: #e6ddf5; --gold: #d97706;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); line-height:1.5; min-height:100vh; }
  header { background: linear-gradient(135deg, var(--purple), var(--purple-dark)); color: white; padding: 20px 18px 24px; text-align:center; }
  header h1 { margin: 4px 0 0; font-size: 1.3rem; }
  header p { margin:0; font-size:0.85rem; opacity:0.9; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px 60px; }

  /* lesson picker */
  .lesson-grid { display:grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
  .lesson-btn { background:white; border:2px solid var(--border); border-radius:12px; padding: 16px 6px; text-align:center; cursor:pointer; font-weight:700; color: var(--purple-dark); font-size:1.05rem; }
  .lesson-btn:active, .lesson-btn.selected { border-color: var(--purple); background: var(--purple-light); }
  .lesson-btn .count { display:block; font-size:0.7rem; font-weight:400; color: var(--gray); margin-top:2px; }
  .start-btn { width:100%; margin-top:20px; padding:14px; background:var(--purple); color:white; border:none; border-radius:10px; font-size:1rem; font-weight:700; cursor:pointer; }
  .start-btn:hover { background: var(--purple-dark); }
  .mode-row { display:flex; gap:10px; margin-top:16px; }
  .mode-btn { flex:1; padding:10px; border-radius:10px; border:2px solid var(--border); background:white; font-weight:600; color:var(--gray); cursor:pointer; font-size:0.85rem; }
  .mode-btn.selected { border-color:var(--purple); color:var(--purple-dark); background:var(--purple-light); }
  .section-label { font-size:0.85rem; color:var(--gray); margin: 18px 0 4px; font-weight:600; }

  /* quiz card */
  .quiz-card { display:none; }
  .quiz-card.active { display:block; }
  .progress-row { display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .progress-bar { flex:1; height:8px; background:var(--purple-light); border-radius:4px; overflow:hidden; }
  .progress-fill { height:100%; background:var(--purple); width:0%; transition:width .3s; }
  .progress-count { font-size:0.8rem; color:var(--gray); white-space:nowrap; }
  .score-badge { font-size:0.8rem; color:var(--green); font-weight:700; white-space:nowrap; }
  .word-card { background:white; border-radius:16px; padding: 30px 20px; text-align:center; box-shadow: 0 4px 16px rgba(124,58,237,0.1); margin-bottom: 18px; }
  .word-lang { font-size:0.75rem; color:var(--gray); text-transform:uppercase; letter-spacing:0.05em; }
  .word-main { font-size: 1.9rem; font-weight:800; color:var(--purple-dark); margin: 6px 0 0; }
  .options { display:grid; gap: 10px; }
  .opt-btn { padding: 14px 12px; border-radius: 10px; border:2px solid var(--border); background:white; font-size:1rem; cursor:pointer; text-align:left; }
  .opt-btn.correct { border-color: var(--green); background:#f0fdf4; color:var(--green); font-weight:700; }
  .opt-btn.wrong { border-color: var(--red); background:#fef2f2; color:var(--red); font-weight:700; }
  .opt-btn:disabled { cursor:default; }
  .next-btn { width:100%; margin-top:16px; padding:13px; background:var(--purple); color:white; border:none; border-radius:10px; font-weight:700; font-size:0.95rem; cursor:pointer; display:none; }
  .next-btn.show { display:block; }

  /* result */
  .result-card { display:none; text-align:center; }
  .result-card.active { display:block; }
  .result-emoji { font-size: 3rem; }
  .result-score { font-size: 2.2rem; font-weight:800; color:var(--purple-dark); margin: 6px 0; }
  .result-label { color:var(--gray); margin-bottom: 20px; }
  .mistakes-list { text-align:left; background:white; border-radius:12px; padding:14px 16px; margin-bottom:18px; }
  .mistakes-list h3 { font-size:0.9rem; margin:0 0 8px; color:var(--purple-dark); }
  .mistake-item { font-size:0.88rem; padding:6px 0; border-bottom:1px solid var(--border); }
  .mistake-item:last-child { border-bottom:none; }
  .mistake-item b { color: var(--red); }
  .retry-btn, .back-btn { width:100%; padding:13px; border-radius:10px; font-weight:700; font-size:0.95rem; cursor:pointer; margin-bottom:10px; }
  .retry-btn { background:var(--purple); color:white; border:none; }
  .back-btn { background:white; color:var(--purple-dark); border:2px solid var(--purple-light); }

  #setup-card.hidden, .quiz-card.hidden, .result-card.hidden { display:none !important; }
  footer { text-align:center; color:var(--gray); font-size:0.75rem; padding:10px 20px 30px; }
</style>
</head>

<header>
  <p>Guli | Rus tili — Книга 3 (Падежи)</p>
  <h1>🎮 Проверь свой словарь</h1>
</header>
<div class="wrap">

  <div id="setup-card">

    <button class="start-btn" id="start-btn">Начать игру</button>

  <div class="quiz-card" id="quiz-card">

    <div class="word-card">
      <div class="word-lang" id="word-lang">Русский</div>
      <div class="word-main" id="word-main">слово</div>
    </div>
    <div class="options" id="options"></div>
    <button class="next-btn" id="next-btn">Следующее слово →</button>
  </div>

  <div class="result-card" id="result-card">
    <div class="result-emoji" id="result-emoji">🎉</div>
    <div class="result-score" id="result-score">8/10</div>
    <div class="result-label" id="result-label">Отличный результат!</div>
    <div class="mistakes-list" id="mistakes-list" style="display:none;">
      <h3>Слова для повторения:</h3>
      <div id="mistakes-body"></div>
    </div>
    <button class="retry-btn" id="retry-btn">Играть ещё раз</button>
    <button class="back-btn" id="back-btn">Выбрать другой урок</button>
  </div>

</div>
<footer>Guli | Rus tili — результат не сохраняется на сервере</footer>

let selectedLesson = null;
let selectedMode = "ru-uz";
let quizWords = [];
let currentIndex = 0;
let score = 0;
let mistakes = [];

const lessonGrid = document.getElementById("lesson-grid");
Object.keys(VOCAB).sort((a,b)=>a-b).forEach(num => {
  const btn = document.createElement("div");
  btn.className = "lesson-btn";
  btn.dataset.lesson = num;
  btn.innerHTML = `Урок ${num}<span class="count">${VOCAB[num].length} слов</span>`;
  btn.addEventListener("click", () => {
    document.querySelectorAll(".lesson-btn").forEach(b=>b.classList.remove("selected"));
    btn.classList.add("selected");
    selectedLesson = num;
  });
  lessonGrid.appendChild(btn);
});

document.querySelectorAll(".mode-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".mode-btn").forEach(b=>b.classList.remove("selected"));
    btn.classList.add("selected");
    selectedMode = btn.dataset.mode;
  });
});

function shuffle(arr) {
  const a = [...arr];
  for (let i=a.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

document.getElementById("start-btn").addEventListener("click", () => {
  if (!selectedLesson) { alert("Выбери урок!"); return; }
  const pool = VOCAB[selectedLesson];
  const count = Math.min(10, pool.length);
  quizWords = shuffle(pool).slice(0, count);
  currentIndex = 0;
  score = 0;
  mistakes = [];
  document.getElementById("setup-card").classList.add("hidden");
  document.getElementById("result-card").classList.remove("active");
  document.getElementById("quiz-card").classList.add("active");
  showQuestion();
});

function showQuestion() {
  const pool = VOCAB[selectedLesson];
  const pair = quizWords[currentIndex];
  const qIdx = selectedMode === "ru-uz" ? 0 : 1;
  const aIdx = selectedMode === "ru-uz" ? 1 : 0;

  document.getElementById("word-lang").textContent = selectedMode === "ru-uz" ? "Русский" : "O'zbekcha";
  document.getElementById("word-main").textContent = pair[qIdx];
  document.getElementById("progress-count").textContent = `${currentIndex+1}/${quizWords.length}`;
  document.getElementById("progress-fill").style.width = (currentIndex/quizWords.length*100) + "%";
  document.getElementById("score-badge").textContent = "✓ " + score;

  let distractors = shuffle(pool.filter(p => p[aIdx] !== pair[aIdx])).slice(0,3).map(p=>p[aIdx]);
  let options = shuffle([pair[aIdx], ...distractors]);

  const optsEl = document.getElementById("options");
  optsEl.innerHTML = "";
  const nextBtn = document.getElementById("next-btn");
  nextBtn.classList.remove("show");

  options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "opt-btn";
    btn.textContent = opt;
    btn.addEventListener("click", () => {
      document.querySelectorAll(".opt-btn").forEach(b => b.disabled = true);
      if (opt === pair[aIdx]) {
        btn.classList.add("correct");
        score++;
      } else {
        btn.classList.add("wrong");
        mistakes.push({ q: pair[qIdx], correct: pair[aIdx], picked: opt });
        document.querySelectorAll(".opt-btn").forEach(b => { if (b.textContent === pair[aIdx]) b.classList.add("correct"); });
      }
      document.getElementById("score-badge").textContent = "✓ " + score;
      nextBtn.classList.add("show");
    });
    optsEl.appendChild(btn);
  });
}

document.getElementById("next-btn").addEventListener("click", () => {
  currentIndex++;
  if (currentIndex >= quizWords.length) {
    showResult();
  } else {
    showQuestion();
  }
});

function showResult() {
  document.getElementById("quiz-card").classList.remove("active");
  document.getElementById("result-card").classList.add("active");
  const pct = Math.round(score/quizWords.length*100);
  document.getElementById("result-score").textContent = `${score}/${quizWords.length}`;
  let emoji = "🎉", label = "Отличный результат!";
  if (pct < 50) { emoji = "💪"; label = "Продолжай заниматься — получится!"; }
  else if (pct < 80) { emoji = "👍"; label = "Хорошо, но есть куда расти!"; }
  document.getElementById("result-emoji").textContent = emoji;
  document.getElementById("result-label").textContent = label;

  const mistakesList = document.getElementById("mistakes-list");
  if (mistakes.length > 0) {
    mistakesList.style.display = "block";
    document.getElementById("mistakes-body").innerHTML = mistakes.map(m =>
      `<div class="mistake-item">${m.q} — <b>${m.correct}</b> (ответил: ${m.picked})</div>`
    ).join("");
  } else {
    mistakesList.style.display = "none";
  }
}

document.getElementById("retry-btn").addEventListener("click", () => {
  document.getElementById("result-card").classList.remove("active");
  document.getElementById("quiz-card").classList.add("active");
  quizWords = shuffle(VOCAB[selectedLesson]).slice(0, Math.min(10, VOCAB[selectedLesson].length));
  currentIndex = 0; score = 0; mistakes = [];
  showQuestion();
});

document.getElementById("back-btn").addEventListener("click", () => {
  document.getElementById("result-card").classList.remove("active");
  document.getElementById("setup-card").classList.remove("hidden");
});
</script>
