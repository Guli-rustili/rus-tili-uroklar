const STORAGE_KEY = "guli_lesson_" + LESSON.id + "_progress";

function loadProgress() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch(e) { return {}; }
}
function saveProgress(p) { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }
let progress = loadProgress();

function normalize(s) {
  return s.toLowerCase().replace(/ё/g,"е").replace(/[.,!?;:"'()«»]/g,"").replace(/\s+/g," ").trim();
}

// ---- tabs ----
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("panel-"+btn.dataset.tab).classList.add("active");
  });
});

// ---- render vocab ----
function renderVocabTable(bodyId, rows) {
  const tbody = document.getElementById(bodyId);
  tbody.innerHTML = rows.map((r,i) => `<tr><td>${i+1}</td><td>${r[0]}</td><td class="uz">${r[1]}</td></tr>`).join("");
}
renderVocabTable("vocab-nouns-body", LESSON.vocab.nouns.map(n => [n[0], n[2]]));
renderVocabTable("vocab-adj-body", LESSON.vocab.adjectives);
renderVocabTable("vocab-verbs-body", LESSON.vocab.verbs);

// ---- render grammar ----
document.getElementById("grammar-explanation").textContent = LESSON.grammar_explanation;
document.getElementById("grammar-examples").innerHTML = LESSON.examples.map(e => `<li>${e}</li>`).join("");

// ---- render task ----
const task = LESSON.tasks[0];
document.getElementById("task-title").textContent = task.title;
document.getElementById("task-instruction").textContent = task.instruction;
document.getElementById("task-example").innerHTML = `<b>Пример:</b> ${task.example.prompt} — <span style="color:var(--purple-dark);font-weight:600;">${task.example.answer}</span>`;

function updateProgressBar() {
  const total = task.items.length;
  const done = Object.keys(progress).filter(k => progress[k]).length;
  document.getElementById("progress-fill").style.width = (done/total*100) + "%";
  document.getElementById("progress-text").textContent = done + "/" + total;
}

function renderTaskItems() {
  const container = document.getElementById("task-items");
  container.innerHTML = task.items.map((item, i) => {
    const key = "task1_" + i;
    const isDone = !!progress[key];
    return `
    <div class="task-item" data-idx="${i}">
      <div class="task-prompt"><b>${i+1}.</b> ${item.prompt}</div>
      <div class="task-row">
        <input type="text" class="task-input ${isDone?'correct':''}" placeholder="Введите ответ..." ${isDone?'disabled':''} value="${isDone?item.answer:''}">
        <button class="btn check-btn" ${isDone?'disabled':''}>Проверить</button>
        <span class="feedback ${isDone?'ok':''}">${isDone?'✓ Верно':''}</span>
      </div>
      <div class="reveal">Правильный ответ: ${item.answer}</div>
    </div>`;
  }).join("");

  container.querySelectorAll(".task-item").forEach(itemEl => {
    const idx = Number(itemEl.dataset.idx);
    const input = itemEl.querySelector(".task-input");
    const btn = itemEl.querySelector(".check-btn");
    const feedback = itemEl.querySelector(".feedback");
    const reveal = itemEl.querySelector(".reveal");
    const item = task.items[idx];

    function submit() {
      const val = input.value.trim();
      if (!val) return;
      if (normalize(val) === normalize(item.answer)) {
        feedback.textContent = "✓ Верно";
        feedback.className = "feedback ok";
        input.classList.add("correct");
        input.classList.remove("wrong");
        input.disabled = true;
        btn.disabled = true;
        progress["task1_"+idx] = true;
        saveProgress(progress);
        updateProgressBar();
      } else {
        feedback.textContent = "✗ Неверно";
        feedback.className = "feedback bad";
        input.classList.add("wrong");
        input.classList.remove("correct");
        reveal.style.display = "block";
      }
    }
    btn.addEventListener("click", submit);
    input.addEventListener("keydown", e => { if (e.key==="Enter") submit(); });
  });
}

document.getElementById("reset-btn").addEventListener("click", () => {
  if (confirm("Сбросить весь прогресс по этому уроку?")) {
    progress = {};
    saveProgress(progress);
    renderTaskItems();
    updateProgressBar();
  }
});

renderTaskItems();
updateProgressBar();
</script>
