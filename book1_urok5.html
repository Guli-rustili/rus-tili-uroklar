<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Урок 5 | Guli Rus tili</title>
<style>
  :root {
    --purple: #7c3aed; --purple-dark: #5b21b6; --purple-light: #f3ecfd;
    --bg: #faf8ff; --text: #201533; --gray: #6b6478; --green: #15803d; --red: #b91c1c;
    --border: #e6ddf5;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); line-height:1.55; }
  header { background: linear-gradient(135deg, var(--purple), var(--purple-dark)); color: white; padding: 22px 18px 26px; }
  header .eyebrow { font-size: 0.8rem; opacity: 0.85; margin: 0 0 4px; }
  header h1 { margin: 0; font-size: 1.2rem; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 60px; }
  .tabs { display:flex; gap:8px; margin: -14px 0 20px; position: relative; z-index: 2; flex-wrap:wrap; }
  .tab-btn { flex:1; min-width:100px; background: white; border: 1px solid var(--border); padding: 10px 6px; border-radius: 10px; font-size: 0.85rem; font-weight:600; color: var(--purple-dark); cursor:pointer; box-shadow: 0 2px 8px rgba(124,58,237,0.08); }
  .tab-btn.active { background: var(--purple); color: white; border-color: var(--purple); }
  .panel { display:none; }
  .panel.active { display:block; }
  .card { background: white; border: 1px solid var(--border); border-radius: 14px; padding: 18px 18px 20px; margin-bottom: 18px; }
  .card h2 { margin: 0 0 10px; font-size: 1.05rem; color: var(--purple-dark); }
  table.vocab { width:100%; border-collapse: collapse; font-size: 0.88rem; }
  table.vocab th { background: var(--purple-light); text-align:left; padding: 7px 8px; }
  table.vocab td { padding: 6px 8px; border-bottom: 1px solid var(--border); }
  table.vocab td.uz { color: var(--gray); }
  .task-block { margin-bottom: 26px; }
  .task-block h3 { font-size: 0.98rem; color: var(--purple-dark); margin: 0 0 4px; }
  .task-block .instr { font-size: 0.85rem; color: var(--gray); margin: 0 0 10px; }
  .progress-summary { display:flex; align-items:center; gap:10px; margin-bottom: 12px; }
  .progress-bar { flex:1; height: 8px; background: var(--purple-light); border-radius: 5px; overflow:hidden; }
  .progress-fill { height:100%; background: var(--purple); width:0%; transition: width .3s; }
  .progress-text { font-size: 0.8rem; color: var(--gray); white-space:nowrap; }
  .task-item { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .task-item:last-child { border-bottom:none; }
  .task-prompt { margin-bottom: 6px; font-size: 0.93rem; }
  .task-row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .task-input { flex:1; min-width: 140px; padding: 8px 10px; border:1px solid var(--border); border-radius: 8px; font-size: 0.92rem; }
  .task-input.correct { border-color: var(--green); background:#f0fdf4; }
  .task-input.wrong { border-color: var(--red); background:#fef2f2; }
  .btn { padding: 8px 14px; background: var(--purple); color:white; border:none; border-radius:8px; font-weight:600; font-size:0.85rem; cursor:pointer; }
  .btn:hover { background: var(--purple-dark); }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .feedback { font-size: 0.82rem; font-weight:600; min-width: 60px; }
  .feedback.ok { color: var(--green); }
  .feedback.bad { color: var(--red); }
  .reveal { font-size: 0.8rem; color: var(--gray); margin-top:4px; display:none; }
  footer { text-align:center; color:var(--gray); font-size:0.75rem; padding:10px 20px 30px; }
</style>
</head>
<body>
<header>
  <p class="eyebrow">Guli | Rus tili — Книга 1</p>
  <h1>Урок 5. Числительные (количественные и порядковые)</h1>
</header>
<div class="wrap">
  <div class="tabs">
    <button class="tab-btn active" data-tab="vocab">📖 Словарь</button>
    <button class="tab-btn" data-tab="tasks">✏️ Задания</button>
    <button class="tab-btn" data-tab="homework">🏠 Дом. задание</button>
  </div>

  <div id="panel-vocab" class="panel active">
    <div class="card">
      <h2>Слова урока (<span id="vocab-count"></span>)</h2>
      <table class="vocab"><thead><tr><th>№</th><th>Русский</th><th>O'zbekcha</th></tr></thead>
      <tbody id="vocab-body"></tbody></table>
    </div>
  </div>

  <div id="panel-tasks" class="panel">
    <div id="tasks-container"></div>
  </div>

  <div id="panel-homework" class="panel">
    <div id="homework-container"></div>
  </div>
</div>
<footer>Guli | Rus tili — прогресс сохраняется локально в этом браузере</footer>

<script>
const LESSON = {"id": 5, "title": "Числительные (количественные и порядковые)", "vocab": [["один", "bir"], ["два", "ikki"], ["три", "uch"], ["четыре", "to'rt"], ["пять", "besh"], ["шесть", "olti"], ["семь", "yetti"], ["восемь", "sakkiz"], ["девять", "to'qqiz"], ["десять", "o'n"], ["одиннадцать", "o'n bir"], ["двенадцать", "o'n ikki"], ["тринадцать", "o'n uch"], ["четырнадцать", "o'n to'rt"], ["пятнадцать", "o'n besh"], ["шестнадцать", "o'n olti"], ["семнадцать", "o'n yetti"], ["восемнадцать", "o'n sakkiz"], ["девятнадцать", "o'n to'qqiz"], ["двадцать", "yigirma"], ["тридцать", "o'ttiz"], ["сорок", "qirq"], ["пятьдесят", "ellik"], ["шестьдесят", "oltmish"], ["семьдесят", "yetmish"], ["восемьдесят", "sakson"], ["девяносто", "to'qson"], ["сто", "yuz"], ["двести", "ikki yuz"], ["триста", "uch yuz"], ["четыреста", "to'rt yuz"], ["пятьсот", "besh yuz"], ["шестьсот", "olti yuz"], ["семьсот", "yetti yuz"], ["восемьсот", "sakkiz yuz"], ["девятьсот", "to'qqiz yuz"], ["тысяча", "ming"], ["две тысячи", "ikki ming"], ["пять тысяч", "besh ming"], ["десять тысяч", "o'n ming"], ["первый", "birinchi"], ["второй", "ikkinchi"], ["третий", "uchinchi"], ["четвёртый", "to'rtinchi"], ["пятый", "beshinchi"], ["шестой", "oltinchi"], ["седьмой", "yettinchi"], ["восьмой", "sakkizinchi"], ["девятый", "to'qqizinchi"], ["десятый", "o'ninchi"], ["одиннадцатый", "o'n birinchi"], ["двенадцатый", "o'n ikkinchi"], ["тринадцатый", "o'n uchinchi"], ["четырнадцатый", "o'n to'rtinchi"], ["пятнадцатый", "o'n beshinchi"], ["шестнадцатый", "o'n oltinchi"], ["семнадцатый", "o'n yettinchi"], ["восемнадцатый", "o'n sakkizinchi"], ["девятнадцатый", "o'n to'qqizinchi"], ["двадцатый", "yigirmanchi"], ["двадцать первый", "yigirma birinchi"], ["тридцатый", "o'ttizinchi"], ["сороковой", "qirqinchi"], ["пятидесятый", "ellikinchi"], ["шестидесятый", "oltmishinchi"], ["семидесятый", "yetmishinchi"], ["восьмидесятый", "saksoninchi"], ["девяностый", "to'qsoninchi"], ["сотый", "yuzinchi"], ["сто первый", "yuz birinchi"], ["двухсотый", "ikki yuzinchi"], ["трёхсотый", "uch yuzinchi"], ["четырёхсотый", "to'rt yuzinchi"], ["пятисотый", "besh yuzinchi"], ["шестисотый", "olti yuzinchi"], ["семисотый", "yetti yuzinchi"], ["восьмисотый", "sakkiz yuzinchi"], ["девятисотый", "to'qqiz yuzinchi"], ["тысячный", "minginchi"]], "tasks": [{"title": "Задание 1", "instruction": "Berilgan raqamlarni so'z bilan yozing (количественные числительные).", "items": [{"prompt": "35", "answer": "тридцать пять."}, {"prompt": "213", "answer": "двести тринадцать."}, {"prompt": "57", "answer": "пятьдесят семь."}, {"prompt": "1271", "answer": "тысяча двести семьдесят один."}, {"prompt": "89", "answer": "восемьдесят девять."}, {"prompt": "146", "answer": "сто сорок шесть."}, {"prompt": "904", "answer": "девятьсот четыре."}, {"prompt": "2023", "answer": "две тысячи двадцать три."}, {"prompt": "68", "answer": "шестьдесят восемь."}, {"prompt": "317", "answer": "триста семнадцать."}, {"prompt": "1000", "answer": "тысяча."}, {"prompt": "52", "answer": "пятьдесят два."}, {"prompt": "999", "answer": "девятьсот девяносто девять."}, {"prompt": "4567", "answer": "четыре тысячи пятьсот шестьдесят семь."}, {"prompt": "73", "answer": "семьдесят три."}]}, {"title": "Задание 2", "instruction": "Telefon raqamlarini so'z bilan yozing.", "items": [{"prompt": "123-45-67", "answer": "сто двадцать три, сорок пять, шестьдесят семь."}, {"prompt": "200-10-15", "answer": "двести, десять, пятнадцать."}, {"prompt": "555-20-30", "answer": "пятьсот пятьдесят пять, двадцать, тридцать."}, {"prompt": "340-12-11", "answer": "триста сорок, двенадцать, одиннадцать."}, {"prompt": "480-33-22", "answer": "четыреста восемьдесят, тридцать три, двадцать два."}, {"prompt": "610-14-19", "answer": "шестьсот десять, четырнадцать, девятнадцать."}, {"prompt": "275-18-40", "answer": "двести семьдесят пять, восемнадцать, сорок."}, {"prompt": "990-27-16", "answer": "девятьсот девяносто, двадцать семь, шестнадцать."}]}, {"title": "Задание 3", "instruction": "Berilgan raqamlarni tartib son (порядковое числительное) shakliga o'tkazing.", "items": [{"prompt": "46", "answer": "сорок шестой."}, {"prompt": "54", "answer": "пятьдесят четвёртый."}, {"prompt": "62", "answer": "шестьдесят второй."}, {"prompt": "15", "answer": "пятнадцатый."}, {"prompt": "100", "answer": "сотый."}, {"prompt": "23", "answer": "двадцать третий."}, {"prompt": "78", "answer": "семьдесят восьмой."}, {"prompt": "31", "answer": "тридцать первый."}, {"prompt": "90", "answer": "девяностый."}, {"prompt": "12", "answer": "двенадцатый."}, {"prompt": "67", "answer": "шестьдесят седьмой."}, {"prompt": "84", "answer": "восемьдесят четвёртый."}, {"prompt": "101", "answer": "сто первый."}, {"prompt": "55", "answer": "пятьдесят пятый."}, {"prompt": "29", "answer": "двадцать девятый."}]}, {"title": "Задание 4", "instruction": "Namunaga qarab, son va so'zni birlashtiring (родга moslang).", "items": [{"prompt": "5, место", "answer": "Пятое место."}, {"prompt": "2, этаж", "answer": "Второй этаж."}, {"prompt": "3, комната", "answer": "Третья комната."}, {"prompt": "1, урок", "answer": "Первый урок."}, {"prompt": "4, окно", "answer": "Четвёртое окно."}, {"prompt": "10, день", "answer": "Десятый день."}, {"prompt": "6, неделя", "answer": "Шестая неделя."}, {"prompt": "7, класс", "answer": "Седьмой класс."}, {"prompt": "8, место", "answer": "Восьмое место."}, {"prompt": "9, парк", "answer": "Девятый парк."}, {"prompt": "20, этаж", "answer": "Двадцатый этаж."}, {"prompt": "15, комната", "answer": "Пятнадцатая комната."}, {"prompt": "12, урок", "answer": "Двенадцатый урок."}, {"prompt": "100, год", "answer": "Сотый год."}, {"prompt": "3, окно", "answer": "Третье окно."}]}], "homework_sections": [{"title": "Домашнее задание A", "instruction": "Berilgan raqamlarni so'z bilan yozing.", "items": [{"prompt": "94", "answer": "девяносто четыре."}, {"prompt": "258", "answer": "двести пятьдесят восемь."}, {"prompt": "17", "answer": "семнадцать."}, {"prompt": "3456", "answer": "три тысячи четыреста пятьдесят шесть."}, {"prompt": "61", "answer": "шестьдесят один."}, {"prompt": "780", "answer": "семьсот восемьдесят."}, {"prompt": "29", "answer": "двадцать девять."}, {"prompt": "915", "answer": "девятьсот пятнадцать."}, {"prompt": "44", "answer": "сорок четыре."}, {"prompt": "1200", "answer": "тысяча двести."}, {"prompt": "88", "answer": "восемьдесят восемь."}, {"prompt": "333", "answer": "триста тридцать три."}, {"prompt": "506", "answer": "пятьсот шесть."}, {"prompt": "7", "answer": "семь."}, {"prompt": "1999", "answer": "тысяча девятьсот девяносто девять."}]}, {"title": "Домашнее задание B (тест)", "instruction": "Тест. To'g'ri javobni tanlang.", "items": [{"prompt": "2, этаж — а) второй   б) вторая   в) второе", "answer": "а"}, {"prompt": "3, комната — а) третий   б) третья   в) третье", "answer": "б"}, {"prompt": "4, окно — а) четвёртый   б) четвёртая   в) четвёртое", "answer": "в"}, {"prompt": "5, место — а) пятый   б) пятая   в) пятое", "answer": "в"}, {"prompt": "1, урок — а) первый   б) первая   в) первое", "answer": "а"}, {"prompt": "6, неделя — а) шестой   б) шестая   в) шестое", "answer": "б"}, {"prompt": "7, класс — а) седьмой   б) седьмая   в) седьмое", "answer": "а"}, {"prompt": "10, день — а) десятый   б) десятая   в) десятое", "answer": "а"}, {"prompt": "20, этаж — а) двадцатый   б) двадцатая   в) двадцатое", "answer": "а"}, {"prompt": "15, комната — а) пятнадцатый   б) пятнадцатая   в) пятнадцатое", "answer": "б"}, {"prompt": "100, год — а) сотый   б) сотая   в) сотое", "answer": "а"}, {"prompt": "3, окно — а) третий   б) третья   в) третье", "answer": "в"}, {"prompt": "8, место — а) восьмой   б) восьмая   в) восьмое", "answer": "в"}, {"prompt": "12, урок — а) двенадцатый   б) двенадцатая   в) двенадцатое", "answer": "а"}, {"prompt": "9, неделя — а) девятый   б) девятая   в) девятое", "answer": "б"}]}]};
const STORAGE_KEY = "guli_book1_lesson" + LESSON.id + "_progress";

function loadProgress() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch(e) { return {}; }
}
function saveProgress(p) { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }
let progress = loadProgress();

function normalize(s) {
  return s.toLowerCase().replace(/ё/g,"е").replace(/[.,!?;:"'()«»]/g,"").replace(/\s+/g," ").trim();
}

document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("panel-"+btn.dataset.tab).classList.add("active");
  });
});

document.getElementById("vocab-count").textContent = LESSON.vocab.length;
document.getElementById("vocab-body").innerHTML = LESSON.vocab.map((r,i) =>
  `<tr><td>${i+1}</td><td>${r[0]}</td><td class="uz">${r[1]}</td></tr>`
).join("");

function buildItemsHTML(items, keyPrefix, isSelfCheck) {
  return items.map((item, i) => {
    const key = keyPrefix + "_" + i;
    const isDone = !!progress[key];
    return `
    <div class="task-item" data-key="${key}">
      <div class="task-prompt"><b>${i+1}.</b> ${item.prompt}</div>
      <div class="task-row">
        <input type="text" class="task-input ${isDone?'correct':''}" placeholder="Введите ответ..." ${isDone?'disabled':''} value="${isDone&&!isSelfCheck?item.answer:''}">
        <button class="btn check-btn" ${isDone?'disabled':''}>${isSelfCheck ? 'Показать ответ' : 'Проверить'}</button>
        <span class="feedback ${isDone?'ok':''}">${isDone?'✓':''}</span>
      </div>
      <div class="reveal">Ответ: ${item.answer}</div>
    </div>`;
  }).join("");
}

function attachHandlers(container, items, keyPrefix, isSelfCheck, onDone) {
  container.querySelectorAll(".task-item").forEach((itemEl, idx) => {
    const input = itemEl.querySelector(".task-input");
    const btn = itemEl.querySelector(".check-btn");
    const feedback = itemEl.querySelector(".feedback");
    const reveal = itemEl.querySelector(".reveal");
    const item = items[idx];
    const key = keyPrefix + "_" + idx;

    function submit() {
      if (isSelfCheck) {
        reveal.style.display = "block";
        feedback.textContent = "✓"; feedback.className = "feedback ok";
        input.disabled = true; btn.disabled = true;
        progress[key] = true; saveProgress(progress);
        onDone && onDone();
        return;
      }
      const val = input.value.trim();
      if (!val) return;
      if (normalize(val) === normalize(item.answer)) {
        feedback.textContent = "✓"; feedback.className = "feedback ok";
        input.classList.add("correct"); input.classList.remove("wrong");
        input.disabled = true; btn.disabled = true;
        progress[key] = true; saveProgress(progress);
        onDone && onDone();
      } else {
        feedback.textContent = "✗"; feedback.className = "feedback bad";
        input.classList.add("wrong"); input.classList.remove("correct");
        reveal.style.display = "block";
      }
    }
    btn.addEventListener("click", submit);
    input.addEventListener("keydown", e => { if (e.key==="Enter") submit(); });
  });
}

function renderSection(container, sections, keyBase) {
  sections.forEach((task, ti) => {
    const block = document.createElement("div");
    block.className = "card task-block";
    block.innerHTML = `
      <h3>${task.title}</h3>
      <p class="instr">${task.instruction}</p>
      <div class="progress-summary">
        <div class="progress-bar"><div class="progress-fill" id="${keyBase}${ti}-fill"></div></div>
        <div class="progress-text" id="${keyBase}${ti}-text">0/${task.items.length}</div>
      </div>
      <div class="items" id="${keyBase}${ti}-items"></div>
    `;
    container.appendChild(block);
    const itemsEl = block.querySelector(".items");
    const prefix = keyBase + ti;
    itemsEl.innerHTML = buildItemsHTML(task.items, prefix, !!task.selfCheck);
    function updateProg() {
      const total = task.items.length;
      const done = task.items.filter((_, i) => progress[prefix+"_"+i]).length;
      document.getElementById(`${prefix}-fill`).style.width = (done/total*100)+"%";
      document.getElementById(`${prefix}-text`).textContent = done+"/"+total;
    }
    attachHandlers(itemsEl, task.items, prefix, !!task.selfCheck, updateProg);
    updateProg();
  });
}

renderSection(document.getElementById("tasks-container"), LESSON.tasks, "task");
renderSection(document.getElementById("homework-container"), LESSON.homework_sections, "hw");
</script>
</body>
</html>
